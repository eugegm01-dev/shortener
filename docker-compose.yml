version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  shortener:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDRESS: ":8080"
      BASE_URL: "http://localhost:8080"
      FILE_STORAGE_PATH: ""
      DATABASE_DSN: "postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable"
      SECRET_KEY: "my-secret-key-for-jwt-tokens"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: